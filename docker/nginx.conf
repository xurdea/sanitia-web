# nginx: sirve el build estático de Astro (build.format = 'file').
#
# Astro genera /empresas.html, /formacion.html, /formacion/ia-aplicada-visita-medica.html…
# y aquí se sirven como /empresas, /formacion… sin extensión ni barra final,
# que es la forma canónica del sitio (trailingSlash: 'never').

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    # Sin directiva `index`: la portada tiene su propia location (ver abajo).

    server_tokens off;
    # Redirecciones relativas: detrás de Caddy o ngrok, nginx no conoce el
    # dominio público y no debe inventárselo.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # /empresas/ -> /empresas (la raíz "/" no entra: exige al menos un carácter).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Página de error: solo se sirve internamente (una location exacta gana a
    # las regex, así que no le afecta la redirección de abajo).
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Portada. Se sirve el fichero directamente (try_files, sin la directiva
    # `index`): así no hay redirección interna a /index.html, que el bloque de
    # abajo devolvería a "/" en un bucle.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Petición externa a /index.html -> "/".
    location = /index.html {
        return 301 /;
    }

    # /empresas.html -> /empresas, para no tener dos URL por página.
    location ~ ^(.+)\.html$ {
        return 301 $1$is_args$args;
    }

    # Assets con hash en el nombre: caché larga e inmutable.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Páginas y ficheros públicos: el navegador revalida siempre, para que tras
    # un despliegue nadie vea una versión antigua.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # Sin `$uri/` a propósito: todas las páginas existen como fichero .html.
        try_files $uri $uri.html =404;
    }
}
