# Cabeceras de seguridad. Se incluyen en CADA location que define sus propias
# add_header, porque nginx no hereda las del nivel superior en ese caso.
#
# CSP: Astro inserta los scripts pequeños en línea (menú móvil, aparición
# progresiva), por eso script-src necesita 'unsafe-inline'; y Vite incrusta como
# data: los subconjuntos de fuente más pequeños, por eso font-src admite data:.
# No hay recursos de terceros: todo se sirve desde el propio origen.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Solo tiene efecto sobre HTTPS (Caddy o ngrok delante); en HTTP se ignora.
add_header Strict-Transport-Security "max-age=31536000" always;
